title: "Joshua Töpfer"
description: "Software-Entwickler. Ensemble Programming, ADHS in der IT, Software Craftsmanship."
url: "https://joshuatoepfer.de"
baseurl: ""

author:
  name: "Joshua Töpfer"
  email: "joshua.toepfer@innoq.com"

# Portrait image used by the home and about layouts (rendered as background-image
# of the .v1-portrait / .about-portrait box). Path is relative to site root; the
# layouts apply `relative_url` to prepend baseurl.
portrait_image: assets/images/joshua-toepfer-transparent.png

# Accent colour palette. Options are defined in _sass/_tokens.scss ($accents):
# amber | coral | blue | green | lime. Light-mode values are WCAG-AA tuned;
# run `bin/a11y` after changing or adding a palette.
accent: coral

# Jekyll settings
markdown: kramdown
permalink: /posts/:year/:month/:day/:title/

# Sass / SCSS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-ical-feed

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude design handoff & build/tooling artefacts from the generated site
exclude:
  - design_handoff_jekyll
  - README.md
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - .ruby-version
  - bin

# iCalendar feeds (jekyll-ical-feed gem, github.com/hollesse/jekyll-ical-feed). Subscribable at webcal://<host>/<path>.
ical_feeds:
  - path: talks.ics
    source: data:talks
    name: "Talks · Joshua Töpfer"
    timezone: Europe/Berlin
    refresh: PT12H
    transparent: true
    fields:
      title: "{{ where }}: {{ what }}"
      location: "{{ where }}{% if city and city != empty %}, {{ city }}{% endif %}"
      description: abstract
      url: source_url
      uid: source_url
      links:
        Slides: slides
        Video: video
        Mehr: source_url

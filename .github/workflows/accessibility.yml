name: Accessibility (WCAG 2.1 AA)

# Audits the built Jekyll site against WCAG 2.1 AA using pa11y-ci with
# two runners: axe-core (what browser plugins such as axe DevTools and
# Lighthouse use — catches colour-contrast issues that HTML CodeSniffer
# only reports as warnings) and HTML CodeSniffer. Each URL is checked
# twice: dark mode and light mode.
#
# All logic lives in bin/a11y so the exact same audit can be run locally
# (`bin/a11y`). A single violation on any URL × mode combo fails the job.
# See:
# - .pa11yci.json (URL list, runners, WCAG standard)
# - bin/a11y (build, serve, mode forcing, both passes)
# - infrastructure/README.md → "Accessibility checks"
# - ADR-0005 (data-mode mechanism this exploits)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pa11y:
    name: pa11y-ci WCAG 2.1 AA (axe + htmlcs, dark + light)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run accessibility audit (dark + light)
        run: bin/a11y

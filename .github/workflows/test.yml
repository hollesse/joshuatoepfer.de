name: Tests

# Unit tests for the local Jekyll plugins in _plugins/ (currently the
# iCalendar feed generator, _plugins/ical_feed.rb). All logic lives in
# bin/test so the exact same run works locally (`bin/test`).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Plugin tests (minitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bin/test

name: Tests

# Unit tests for the INNOQ sync scripts in .github/scripts/.
# (The iCalendar feed plugin lives in its own repo, hollesse/jekyll-ical-feed,
# and is tested there.)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-scripts:
    name: Sync script tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Same install set as the INNOQ sync workflows.
        run: pip install --quiet feedparser markdownify pyyaml beautifulsoup4

      - name: Run tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
